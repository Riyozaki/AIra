<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Мультяшный белый пеликан с большим клювом и оранжевым мешком едет на бирюзовом велосипеде по лугу.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e8f7"/>
      <stop offset="0.65" stop-color="#e6f5fb"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5d8a7"/>
      <stop offset="1" stop-color="#7cc08c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#eae1d0"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f9a746"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39a0b0"/>
      <stop offset="1" stop-color="#1d7183"/>
    </linearGradient>

    <g id="wheel">
      <circle r="92" fill="none" stroke="#37424a" stroke-width="13"/>
      <circle r="92" fill="none" stroke="#5c6b74" stroke-width="4" stroke-dasharray="9 9" opacity="0.7"/>
      <circle r="80" fill="none" stroke="#cdd8de" stroke-width="7"/>
      <g stroke="#b6c4cb" stroke-width="2.4" stroke-linecap="round">
        <line x1="78" y1="0" x2="-78" y2="0"/>
        <line x1="67.6" y1="39" x2="-67.6" y2="-39"/>
        <line x1="39" y1="67.6" x2="-39" y2="-67.6"/>
        <line x1="0" y1="78" x2="0" y2="-78"/>
        <line x1="-39" y1="67.6" x2="39" y2="-67.6"/>
        <line x1="-67.6" y1="39" x2="67.6" y2="-39"/>
      </g>
      <circle r="11" fill="#5c6b74"/>
      <circle r="4" fill="#dfe8ec"/>
    </g>
  </defs>

  <!-- фон -->
  <rect width="900" height="650" fill="url(#sky)"/>
  <circle cx="150" cy="120" r="110" fill="url(#sunGlow)"/>
  <circle cx="150" cy="120" r="46" fill="#ffe08a"/>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="300" cy="120" rx="56" ry="26"/>
      <ellipse cx="345" cy="108" rx="38" ry="22"/>
      <ellipse cx="262" cy="112" rx="30" ry="18"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="680" cy="95" rx="62" ry="24"/>
      <ellipse cx="628" cy="102" rx="34" ry="17"/>
      <ellipse cx="726" cy="86" rx="36" ry="19"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="500" cy="215" rx="44" ry="16"/>
      <ellipse cx="536" cy="207" rx="28" ry="13"/>
    </g>
  </g>

  <!-- холмы -->
  <path d="M0 520 C 120 452 240 470 350 505 C 470 542 560 500 690 486 C 790 476 860 494 900 508 L900 560 L0 560 Z" fill="#bfe2c7"/>
  <path d="M0 546 C 150 508 270 528 400 546 C 540 566 660 534 900 548 L900 600 L0 600 Z" fill="#a9d8b4"/>

  <!-- земля -->
  <rect x="0" y="556" width="900" height="94" fill="url(#grass)"/>
  <path d="M0 556 C 200 546 400 566 620 552 C 760 543 840 556 900 552" fill="none" stroke="#8ccb99" stroke-width="6" stroke-linecap="round"/>

  <!-- тени -->
  <ellipse cx="300" cy="572" rx="120" ry="16" fill="#5c9c6e" opacity="0.28"/>
  <ellipse cx="630" cy="572" rx="120" ry="16" fill="#5c9c6e" opacity="0.28"/>

  <!-- скорость -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <line x1="120" y1="392" x2="216" y2="392"/>
    <line x1="146" y1="430" x2="232" y2="430"/>
    <line x1="104" y1="468" x2="196" y2="468"/>
  </g>

  <!-- колёса -->
  <use href="#wheel" x="290" y="470"/>
  <use href="#wheel" x="620" y="470"/>

  <!-- цепь и шатуны -->
  <g stroke="#8a9aa3" stroke-width="3.5" fill="none">
    <path d="M452 460 L 292 459"/>
    <path d="M452 511 L 292 482"/>
  </g>
  <circle cx="290" cy="470" r="15" fill="none" stroke="#7d8d96" stroke-width="5"/>
  <circle cx="455" cy="485" r="27" fill="none" stroke="#7d8d96" stroke-width="6"/>
  <circle cx="455" cy="485" r="27" fill="none" stroke="#b9c6cc" stroke-width="2" stroke-dasharray="4 5"/>
  <g stroke="#55636b" stroke-width="8" stroke-linecap="round">
    <line x1="455" y1="485" x2="492" y2="512"/>
    <line x1="455" y1="485" x2="420" y2="458"/>
  </g>
  <circle cx="455" cy="485" r="9" fill="#3f4b52"/>
  <!-- педали -->
  <rect x="471" y="509" width="34" height="10" rx="5" fill="#37424a"/>
  <rect x="402" y="453" width="30" height="9" rx="4.5" fill="#37424a"/>

  <!-- рама -->
  <g stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="405" y1="345" x2="597" y2="345"/>
    <line x1="455" y1="485" x2="603" y2="378"/>
    <line x1="455" y1="485" x2="405" y2="345"/>
    <line x1="455" y1="485" x2="290" y2="470"/>
    <line x1="405" y1="345" x2="290" y2="470"/>
  </g>
  <!-- вилка и рулевая колонка -->
  <path d="M597 345 L 610 392 C 616 424 618 448 620 470" stroke="url(#frameGrad)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <line x1="597" y1="345" x2="597" y2="318" stroke="#1d7183" stroke-width="10" stroke-linecap="round"/>

  <!-- седло -->
  <g transform="rotate(-8 400 330)">
    <rect x="352" y="320" width="96" height="20" rx="10" fill="#4a3b35"/>
    <rect x="352" y="320" width="96" height="9" rx="4.5" fill="#6b564c"/>
  </g>

  <!-- руль -->
  <path d="M597 318 C 580 300 566 296 552 296" stroke="#37424a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M597 318 C 614 300 630 298 641 304" stroke="#37424a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <rect x="632" y="297" width="20" height="13" rx="6.5" fill="#e8563f" transform="rotate(10 642 303)"/>
  <circle cx="600" cy="315" r="9" fill="#c9d4da" stroke="#37424a" stroke-width="3"/>
  <circle cx="576" cy="296" r="7" fill="#ffd166" stroke="#d9a02a" stroke-width="2.5"/>

  <!-- дальняя нога -->
  <path d="M398 300 C 392 348 398 408 412 448" stroke="#c8761f" stroke-width="19" fill="none" stroke-linecap="round"/>
  <path d="M398 300 C 392 348 398 408 412 448" stroke="#dd8a24" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M402 442 C 394 452 396 462 404 465 C 414 468 427 462 430 454 C 426 445 414 439 402 442 Z" fill="#dd8a24" stroke="#c8761f" stroke-width="2"/>
  <path d="M406 452 L 426 457" fill="none" stroke="#c8761f" stroke-width="1.6" opacity="0.55"/>

  <!-- ближняя нога (за телом) -->
  <path d="M424 292 C 452 366 474 444 488 498" stroke="#c8761f" stroke-width="21" fill="none" stroke-linecap="round"/>
  <path d="M424 292 C 452 366 474 444 488 498" stroke="#f0952f" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M476 490 C 468 502 470 516 482 519 C 496 522 508 514 507 503 C 500 493 486 487 476 490 Z" fill="#f0952f" stroke="#c8761f" stroke-width="2.5"/>
  <path d="M482 504 L 504 509 M484 512 L 502 515" fill="none" stroke="#c8761f" stroke-width="1.6" opacity="0.55"/>

  <!-- хвост -->
  <g stroke="#d9cfba" stroke-width="2.5" stroke-linejoin="round">
    <path d="M348 250 C 320 234 296 232 300 250 C 304 264 318 274 336 276 Z" fill="#f0e9db"/>
    <path d="M348 262 C 318 254 296 258 302 274 C 308 288 328 292 344 286 Z" fill="#f6f0e5"/>
    <path d="M348 274 C 324 274 308 284 318 294 C 326 302 344 298 352 292 Z" fill="#fbf7ef"/>
  </g>

  <!-- тело -->
  <ellipse cx="410" cy="258" rx="80" ry="68" transform="rotate(-10 410 258)" fill="url(#bodyGrad)" stroke="#d9cfba" stroke-width="2.5"/>

  <!-- шея -->
  <path d="M446 240 C 458 192 480 164 512 150" stroke="#d9cfba" stroke-width="52" fill="none" stroke-linecap="round"/>
  <path d="M446 240 C 458 192 480 164 512 150" stroke="#fdfaf3" stroke-width="45" fill="none" stroke-linecap="round"/>

  <!-- голова -->
  <ellipse cx="524" cy="146" rx="42" ry="35" transform="rotate(-8 524 146)" fill="url(#bodyGrad)" stroke="#d9cfba" stroke-width="2.5"/>
  <path d="M500 119 C 493 111 495 103 504 102 C 508 107 508 113 506 118 Z" fill="#f6f0e5" stroke="#d9cfba" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M509 116 C 506 106 511 99 520 100 C 521 106 518 112 515 117 Z" fill="#fbf7ef" stroke="#d9cfba" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M519 117 C 519 108 525 103 533 105 C 532 111 528 116 524 119 Z" fill="#f6f0e5" stroke="#d9cfba" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- клюв: надклювье -->
  <path d="M552 122 C 604 130 662 146 702 158 C 707 161 705 168 698 168 C 640 165 578 158 550 150 Z" fill="#f7ac4b" stroke="#d9812a" stroke-width="2.5"/>
  <!-- клюв: мешок -->
  <path d="M550 149 C 592 158 652 166 698 166 C 674 208 612 218 574 195 C 556 184 547 166 550 149 Z" fill="url(#pouchGrad)" stroke="#d9812a" stroke-width="2.5"/>
  <path d="M572 176 C 606 186 650 180 676 170" fill="none" stroke="#e39433" stroke-width="2" opacity="0.75"/>
  <path d="M566 158 C 590 166 650 172 690 170" fill="none" stroke="#d9812a" stroke-width="2" opacity="0.5"/>

  <!-- глаз -->
  <ellipse cx="532" cy="134" rx="11" ry="10" fill="#ffffff" stroke="#d9cfba" stroke-width="2"/>
  <circle cx="535" cy="135" r="5.4" fill="#2c2a28"/>
  <circle cx="533" cy="132.5" r="1.9" fill="#ffffff"/>
  <path d="M520 121 C 528 116 540 117 546 122" fill="none" stroke="#b9ab90" stroke-width="2.5" stroke-linecap="round"/>

  <!-- крыло -->
  <path d="M386 222 C 452 212 530 244 580 286 C 558 308 512 314 470 302 C 429 290 396 262 386 222 Z" fill="#f5efe3" stroke="#d9cfba" stroke-width="2.5"/>
  <path d="M418 250 C 452 272 496 290 540 298 M404 232 C 440 254 486 274 528 284 M446 264 C 470 284 500 296 528 302" fill="none" stroke="#ddd2b9" stroke-width="2" stroke-linecap="round"/>
  <!-- кончик крыла на руле -->
  <path d="M556 282 C 570 282 582 290 586 300 C 576 306 562 304 552 296 Z" fill="#eae2d2" stroke="#d9cfba" stroke-width="2"/>

  <!-- ближняя нога -->
  <!-- трава на переднем плане -->
  <g stroke="#5fa774" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M70 620 C 76 604 78 596 90 588"/>
    <path d="M82 622 C 86 608 92 600 104 596"/>
    <path d="M812 616 C 818 598 828 590 840 586"/>
    <path d="M826 620 C 832 606 840 598 852 594"/>
    <path d="M430 616 C 434 604 438 598 448 592"/>
    <path d="M444 618 C 448 606 454 600 464 596"/>
  </g>
  <g>
    <circle cx="150" cy="628" r="7" fill="#ffe08a"/>
    <circle cx="150" cy="628" r="3" fill="#f9a746"/>
    <circle cx="702" cy="636" r="6" fill="#ffd1e0"/>
    <circle cx="702" cy="636" r="2.6" fill="#ffe08a"/>
    <circle cx="330" cy="644" r="5.5" fill="#ffffff"/>
    <circle cx="330" cy="644" r="2.4" fill="#ffe08a"/>
  </g>
</svg>
