<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican pedals a bright yellow bicycle on a seaside promenade.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78ccef"/>
      <stop offset="0.62" stop-color="#c7eef4"/>
      <stop offset="0.63" stop-color="#41b4c7"/>
      <stop offset="1" stop-color="#1295ad"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8d998"/>
      <stop offset="1" stop-color="#efb95d"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#f5a33f"/>
      <stop offset="1" stop-color="#dc542e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe85a"/>
      <stop offset="1" stop-color="#f5ae21"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- scenic seaside background -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="975" cy="138" r="62" fill="#fff6b0" opacity=".95"/>
  <g fill="#fff" opacity=".88">
    <path d="M130 149c23-32 59-31 81 0 18-18 54-16 69 9H91c7-8 22-10 39-9z"/>
    <path d="M399 95c18-25 47-24 65 0 14-14 42-13 54 8H367c5-7 17-10 32-8z"/>
    <path d="M705 205c20-29 51-28 71 0 16-16 47-14 60 9H665c7-8 23-11 40-9z"/>
  </g>
  <path d="M0 496c74-23 146-18 224 3 82 22 148 22 232 0 94-25 174-23 263 2 99 28 187 22 278-3 68-19 137-20 203-1v177H0z" fill="#1ea9be" opacity=".85"/>
  <g fill="none" stroke="#dbf9f6" stroke-width="8" stroke-linecap="round" opacity=".7">
    <path d="M35 541c62-19 127-18 195 1"/>
    <path d="M673 556c73-20 145-20 213 1"/>
    <path d="M925 523c64-18 131-18 198 1"/>
  </g>
  <path d="M0 623c162-36 279-28 417 2 155 34 283 32 438-2 121-27 236-31 345-3v280H0z" fill="url(#sand)"/>
  <path d="M0 705c196-23 370-17 538 8 215 32 416 28 662-8v195H0z" fill="#f4c66f" opacity=".63"/>
  <g fill="#dca64d" opacity=".55">
    <ellipse cx="89" cy="735" rx="4" ry="2"/><ellipse cx="176" cy="798" rx="7" ry="3"/><ellipse cx="990" cy="750" rx="5" ry="2"/>
    <ellipse cx="1085" cy="676" rx="3" ry="2"/><ellipse cx="335" cy="722" rx="4" ry="2"/><ellipse cx="731" cy="801" rx="6" ry="3"/>
  </g>

  <!-- distant pier -->
  <g opacity=".7" fill="#875f43">
    <rect x="45" y="538" width="245" height="12" rx="5"/>
    <path d="M68 549h15l-13 73H57zm80 0h15l-11 73h-13zm81 0h15l-11 73h-13z"/>
  </g>
  <g fill="none" stroke="#40526a" stroke-linecap="round" stroke-width="5">
    <path d="M838 205q13-13 26 0q13-13 26 0"/><path d="M931 273q13-13 26 0q13-13 26 0"/>
  </g>

  <!-- cast shadow -->
  <ellipse cx="625" cy="787" rx="365" ry="42" fill="#a26f43" opacity=".25" filter="url(#shadow)"/>

  <!-- bicycle wheels -->
  <g fill="#fff4d8" stroke="#273c4d" stroke-width="18">
    <circle cx="390" cy="693" r="137"/>
    <circle cx="800" cy="693" r="137"/>
  </g>
  <g fill="none" stroke="#9cb2b8" stroke-width="4" opacity=".9">
    <path d="M390 559v268M256 693h268M295 598l190 190M485 598L295 788"/>
    <path d="M800 559v268M666 693h268M705 598l190 190M895 598L705 788"/>
  </g>
  <g fill="#334b5d">
    <circle cx="390" cy="693" r="12"/><circle cx="800" cy="693" r="12"/>
  </g>

  <!-- bright step-through bicycle frame -->
  <g fill="none" stroke="url(#frame)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round">
    <path d="M390 693L516 506l150 187H390z"/>
    <path d="M516 506h195L800 693"/>
    <path d="M516 506l-20-80"/>
    <path d="M711 506l48-88"/>
  </g>
  <g fill="none" stroke="#294153" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M482 421h56"/>
    <path d="M757 419l21-37l54-13"/>
    <path d="M801 367l35 10"/>
  </g>
  <g fill="#f7c234" stroke="#294153" stroke-width="11">
    <circle cx="666" cy="693" r="33"/>
  </g>
  <g stroke="#294153" stroke-width="10" stroke-linecap="round">
    <path d="M643 716l-45 29M689 670l43-28"/>
  </g>
  <path d="M762 421h55l-12 71h-35z" fill="#e97242" stroke="#294153" stroke-width="9" stroke-linejoin="round"/>
  <g stroke="#fff5c8" stroke-width="4" opacity=".8"><path d="M768 436h40M766 452h39M764 468h38"/></g>

  <!-- pelican's seated body -->
  <path d="M403 481c-5-107 55-195 174-199 102-3 190 64 197 178 4 65-31 142-106 162-79 21-181-5-230-64-23-28-34-76-35-137z" fill="#f8f3e3" stroke="#294153" stroke-width="12" stroke-linejoin="round"/>
  <path d="M469 404c22-54 74-91 129-92 78-1 147 54 152 133-55-15-104 12-139 47-47 47-98 39-142 5z" fill="#e5edf0"/>
  <path d="M443 512c45 27 91 32 139 19 24-7 44-23 62-42 20 56 6 124-28 151-52 41-147 22-178-35-16-29-16-68 5-93z" fill="#d7e3e6"/>

  <!-- wing reaching toward handlebar -->
  <path d="M604 454c31-35 57-54 91-65 39-13 75 4 77 33 2 24-27 32-54 40-28 9-50 31-79 70-18 23-51 6-43-23 2-8 4-13 8-20z" fill="#f8f3e3" stroke="#294153" stroke-width="12" stroke-linejoin="round"/>
  <path d="M623 477c32-18 63-48 102-60" fill="none" stroke="#c4d6db" stroke-width="9" stroke-linecap="round"/>
  <path d="M724 420c11 2 18 5 26 12" fill="none" stroke="#e97946" stroke-width="13" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M475 403c-54-64-72-164-41-237 31-73 110-113 180-87 55 21 80 84 61 140-15 44-49 73-80 101-27 24-38 65-21 99-20 38-71 36-99-23z" fill="#faf5e7" stroke="#294153" stroke-width="12" stroke-linejoin="round"/>
  <path d="M468 334c17 30 44 47 78 51-4-46 13-82 46-115 21-21 36-47 36-78-46-10-104 17-132 67-13 24-21 48-28 75z" fill="#e4edef"/>
  <circle cx="565" cy="181" r="8" fill="#263b4d"/>
  <circle cx="568" cy="178" r="2.8" fill="#fff"/>

  <!-- characteristic pelican bill and pouch -->
  <path d="M561 204c50-10 111-4 160 13 25 9 29 28 18 43-16 22-71 45-143 51-47 4-75-4-86-21-10-16 8-33 51-43z" fill="url(#beak)" stroke="#294153" stroke-width="12" stroke-linejoin="round"/>
  <path d="M510 245c37 14 87 18 154 4-20 39-61 67-111 65-34-2-57-23-57-44 0-10 4-18 14-25z" fill="#f6a350" stroke="#294153" stroke-width="12" stroke-linejoin="round"/>
  <path d="M545 274c41 11 80 10 118-5" fill="none" stroke="#d45d39" stroke-width="7" stroke-linecap="round"/>
  <path d="M601 217c45-4 83 2 111 14" fill="none" stroke="#ffd36c" stroke-width="9" stroke-linecap="round"/>

  <!-- happy face -->
  <path d="M548 204q12 12 25 0" fill="none" stroke="#294153" stroke-width="6" stroke-linecap="round"/>

  <!-- legs and webbed feet pedalling -->
  <path d="M534 594c25 32 59 58 99 78" fill="none" stroke="#f7f2e0" stroke-width="26" stroke-linecap="round"/>
  <path d="M605 653l35 38" fill="none" stroke="#f7f2e0" stroke-width="24" stroke-linecap="round"/>
  <path d="M628 687c15 4 30 1 40-5-5 18-30 31-55 23-12-4-14-15-3-20 7-4 13-4 18 2z" fill="#f18e48" stroke="#294153" stroke-width="8" stroke-linejoin="round"/>
  <path d="M509 589c-28 29-61 51-99 66" fill="none" stroke="#eef1e5" stroke-width="25" stroke-linecap="round"/>
  <path d="M420 647l-23 47" fill="none" stroke="#eef1e5" stroke-width="23" stroke-linecap="round"/>
  <path d="M409 690c-13 11-29 13-42 10 3 19 30 32 54 20 11-6 10-17-2-21-8-3-14-1-10-9z" fill="#f18e48" stroke="#294153" stroke-width="8" stroke-linejoin="round"/>

  <!-- jaunty hat -->
  <path d="M459 111c31-47 101-71 157-38l-16 44c-41-20-80-8-112 19z" fill="#ef6242" stroke="#294153" stroke-width="11" stroke-linejoin="round"/>
  <path d="M438 132c44-24 122-30 176-3 12 6 10 21-3 24-53 10-116 10-174 1-16-3-15-15 1-22z" fill="#f6bf35" stroke="#294153" stroke-width="11" stroke-linejoin="round"/>
  <path d="M538 81l-6 39" stroke="#ffd969" stroke-width="8" stroke-linecap="round"/>

  <!-- foreground sea grass -->
  <g fill="none" stroke="#4b9c75" stroke-width="9" stroke-linecap="round">
    <path d="M98 870q10-58 35-95M123 870q-9-54-32-79M147 870q21-43 53-64M1050 876q-5-65-29-100M1075 876q20-57 58-85M1092 876q-15-44-45-67"/>
  </g>
  <text x="600" y="855" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#6f543d" letter-spacing="4">COASTAL CRUISER</text>
</svg>
