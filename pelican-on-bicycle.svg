<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican pedals a green bicycle along a sunny seaside road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7e9fb"/>
      <stop offset="1" stop-color="#edfaff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37b8d9"/>
      <stop offset="1" stop-color="#087ca8"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf7c"/>
      <stop offset=".54" stop-color="#ffb34b"/>
      <stop offset="1" stop-color="#ee7953"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74db83"/>
      <stop offset="1" stop-color="#168d6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="12" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky, sun, sea -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1285" cy="174" r="101" fill="#fff1a8" opacity=".56" filter="url(#soft)"/>
  <circle cx="1285" cy="174" r="77" fill="#ffe37b"/>
  <g fill="#fff" opacity=".88">
    <path d="M115 170c43-54 115-30 126 9 45-34 114-5 111 45H89c-2-23 7-41 26-54z"/>
    <path d="M610 104c31-37 84-22 93 8 33-24 80-2 78 36H590c-1-19 5-33 20-44z"/>
    <path d="M1406 320c25-31 68-18 75 7 27-19 65-2 63 29h-156c-1-15 5-26 18-36z"/>
  </g>
  <path d="M0 495 C190 465 320 520 485 488 S790 458 970 494 S1275 521 1600 464 V734H0Z" fill="url(#sea)"/>
  <g fill="none" stroke="#b3f4f4" stroke-width="8" stroke-linecap="round" opacity=".6">
    <path d="M67 568c54-17 101-17 154 0"/><path d="M395 590c66-19 125-19 187 0"/>
    <path d="M801 561c70-20 131-20 198 0"/><path d="M1160 582c70-19 131-19 198 0"/>
    <path d="M1420 539c50-14 96-14 141 0"/>
  </g>
  <g fill="#305f76" opacity=".57">
    <path d="M0 542l93-102 91 101zM125 542l79-75 73 75zM1350 521l113-120 104 120zM1450 521l86-87 64 87z"/>
  </g>
  <!-- promenade -->
  <path d="M0 703C322 638 652 675 927 713c238 33 423 16 673-30v317H0Z" fill="#f4c46d"/>
  <path d="M0 770c333-62 620-51 932-10 240 32 444 6 668-42" fill="none" stroke="#fff5c7" stroke-width="16" stroke-linecap="round" stroke-dasharray="44 27" opacity=".9"/>
  <path d="M0 884c261-40 564-8 859 45 263 47 507 46 741-7" fill="none" stroke="#e69c4d" stroke-width="8" opacity=".7"/>

  <!-- seaside plants -->
  <g fill="#278f75" stroke="#176852" stroke-width="5" stroke-linejoin="round">
    <path d="M88 704c3-96 55-169 95-179-22 62-5 101 25 119-4-80 30-139 69-154-17 79 5 123 38 140-1-57 28-96 61-110-13 67 11 102 40 119l-8 67z"/>
    <path d="M1425 679c0-80 33-139 68-151-14 53-3 87 20 103-2-64 25-109 54-120-9 61 8 96 33 110v74z"/>
  </g>
  <g fill="#f68a65"><circle cx="142" cy="562" r="10"/><circle cx="223" cy="608" r="9"/><circle cx="320" cy="592" r="11"/><circle cx="1484" cy="587" r="9"/><circle cx="1552" cy="618" r="11"/></g>

  <!-- ground shadow -->
  <ellipse cx="836" cy="879" rx="505" ry="55" fill="#9b673a" opacity=".24" filter="url(#soft)"/>

  <!-- bicycle -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <g fill="#fcf6dd" stroke="#263d52" stroke-width="18">
      <circle cx="590" cy="785" r="142"/><circle cx="1057" cy="785" r="142"/>
    </g>
    <g fill="none" stroke="#86b7ba" stroke-width="5" opacity=".85">
      <path d="M590 646v278M451 785h278M492 687l196 196M688 687L492 883"/>
      <path d="M1057 646v278M918 785h278M959 687l196 196M1155 687L959 883"/>
    </g>
    <g fill="none" stroke="#263d52" stroke-width="14">
      <circle cx="590" cy="785" r="142"/><circle cx="1057" cy="785" r="142"/>
    </g>
    <!-- frame -->
    <g fill="none" stroke="url(#frame)" stroke-width="29">
      <path d="M590 785L747 553l144 232z"/>
      <path d="M747 553l188 1-133 231"/>
      <path d="M747 553l-33-84"/>
      <path d="M935 554l107-111"/>
    </g>
    <g fill="none" stroke="#1d735b" stroke-width="10">
      <path d="M590 785L747 553l144 232z"/><path d="M747 553l188 1-133 231z"/>
    </g>
    <!-- handlebars and seat -->
    <path d="M1034 449h49c23 0 28 20 11 33l-28 21" fill="none" stroke="#263d52" stroke-width="15"/>
    <path d="M675 463h76" stroke="#263d52" stroke-width="25"/>
    <path d="M681 458h64" stroke="#f5a34d" stroke-width="12"/>
    <!-- crank -->
    <circle cx="802" cy="785" r="41" fill="#f7d360" stroke="#263d52" stroke-width="12"/>
    <path d="M802 785l66-43M802 785l-70 50" fill="none" stroke="#263d52" stroke-width="12"/>
    <path d="M855 738h40M692 838h40" stroke="#263d52" stroke-width="16"/>
    <!-- basket -->
    <path d="M1059 500l125 19-16 101-110-15z" fill="#e7a94c" stroke="#263d52" stroke-width="12"/>
    <path d="M1070 536l105 17M1064 573l105 17M1093 510l-16 96M1132 516l-16 97" stroke="#bf7d38" stroke-width="7"/>
    <path d="M1080 502c15-55 67-57 78-2" fill="none" stroke="#263d52" stroke-width="10"/>
    <g fill="#f36d5e"><circle cx="1120" cy="530" r="16"/><circle cx="1153" cy="550" r="17"/><circle cx="1105" cy="571" r="14"/></g>
  </g>

  <!-- pelican -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wing -->
    <path d="M676 498c-75-82-171-49-189 30-14 62 42 118 145 110 51-4 93-38 104-84z" fill="#d7e9e5" stroke="#263d52" stroke-width="14"/>
    <path d="M524 543c52 32 111 37 165 13M521 577c49 22 98 27 143 10" fill="none" stroke="#9fc7c5" stroke-width="11"/>
    <!-- body -->
    <path d="M622 335c-101 56-128 200-49 300 61 77 164 91 253 35 72-45 92-146 50-225-57-108-157-166-254-110z" fill="#f4faf2" stroke="#263d52" stroke-width="16"/>
    <path d="M650 503c24 92 110 149 195 132 50-9 81-39 96-78-73 38-162 24-240-54z" fill="#d4e8e4"/>
    <!-- neck into head -->
    <path d="M680 449c-31-128-4-250 82-287 74-32 167 4 184 79 11 48-14 99-59 127-42 26-77 40-94 95z" fill="#f6fbf4" stroke="#263d52" stroke-width="16"/>
    <path d="M734 217c23-38 52-59 91-63-49 58-41 119-12 167-34-13-73-54-79-104z" fill="#8dbebd"/>
    <!-- beak and pouch -->
    <path d="M848 256c107-77 223-62 274-5 17 20 4 49-23 55l-202 45c-62 14-93-61-49-95z" fill="url(#beak)" stroke="#263d52" stroke-width="15"/>
    <path d="M890 350l205-45c-28 95-91 159-177 153-49-3-78-44-55-92z" fill="#ffb561" stroke="#263d52" stroke-width="15"/>
    <path d="M881 368c64 21 132 5 184-38" fill="none" stroke="#e67a55" stroke-width="10"/>
    <!-- face -->
    <circle cx="836" cy="254" r="21" fill="#fff" stroke="#263d52" stroke-width="10"/>
    <circle cx="840" cy="258" r="9" fill="#263d52"/>
    <path d="M776 306c22 18 51 19 73 6" fill="none" stroke="#263d52" stroke-width="9"/>
    <path d="M1028 281l41-8" stroke="#ed7151" stroke-width="12"/>
    <!-- scarf -->
    <path d="M661 420c47 25 99 29 145 1l18 49c-52 35-119 31-174-4z" fill="#f36d5e" stroke="#263d52" stroke-width="12"/>
    <path d="M682 456l-28 97 77-44" fill="#f36d5e" stroke="#263d52" stroke-width="12"/>
    <path d="M678 540l52-30" stroke="#ffd98a" stroke-width="10"/>
    <!-- forward wing steering -->
    <path d="M737 481c55 13 104 42 145 87l142-105c25-18 55 12 34 36L885 651c-19 17-48 12-60-10-27-50-69-82-122-97z" fill="#e5f0e9" stroke="#263d52" stroke-width="16"/>
    <path d="M1027 467l39-25" stroke="#f4faf2" stroke-width="21"/>
    <!-- legs -->
    <path d="M689 624c35 55 59 106 43 168" fill="none" stroke="#f0a95b" stroke-width="30"/>
    <path d="M819 645c22 47 49 84 54 98" fill="none" stroke="#f0a95b" stroke-width="30"/>
    <g fill="#f5b15f" stroke="#263d52" stroke-width="11">
      <path d="M707 782c6 23 40 36 67 30-6-25-33-41-67-30z"/>
      <path d="M854 732c9 24 39 37 67 29-9-24-34-39-67-29z"/>
    </g>
    <!-- wing feather lines -->
    <path d="M738 508c40 23 72 57 93 95M712 526c38 23 68 54 90 88" fill="none" stroke="#9fc7c5" stroke-width="10"/>
  </g>

  <!-- little flying birds -->
  <g fill="none" stroke="#263d52" stroke-width="8" stroke-linecap="round"><path d="M349 273c14-15 27-15 41 0 14-15 27-15 41 0"/><path d="M1203 362c11-12 22-12 33 0 11-12 22-12 33 0"/></g>
  <text x="800" y="944" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#42636f">COASTAL CRUISER</text>
</svg>
